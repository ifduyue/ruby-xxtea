name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - macos-26-intel
          - windows-2022
          - windows-11-arm
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    env:
      # RubyInstaller has no aarch64 builds for 3.1-3.3. On windows-11-arm
      # those versions run as x64 under Prism emulation.
      WINDOWS_ARM_X64_RUBY: ${{ matrix.os == 'windows-11-arm' && matrix.ruby != '3.4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: env.WINDOWS_ARM_X64_RUBY != 'true'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install x64 Ruby on Windows ARM (emulated)
        if: env.WINDOWS_ARM_X64_RUBY == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = @{
            '3.1' = @{ ruby = '3.1.7-1'; msys = 'msys2-ucrt64-mingw-w64@r688-gcc@14-openssl@1.1.7z' }
            '3.2' = @{ ruby = '3.2.11-1'; msys = 'msys2-ucrt64.7z' }
            '3.3' = @{ ruby = '3.3.12-1'; msys = 'msys2-ucrt64.7z' }
          }
          $spec = $map['${{ matrix.ruby }}']
          $ver = $spec.ruby
          $rubyUrl = "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-$ver/rubyinstaller-$ver-x64.7z"
          $msysUrl = "https://github.com/ruby/setup-msys2-gcc/releases/latest/download/$($spec.msys)"
          $prefix = "C:\Ruby${{ matrix.ruby }}-x64"
          $tmp = Join-Path $env:RUNNER_TEMP 'ruby-x64'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          curl.exe -fsSL -o "$tmp\ruby.7z" $rubyUrl
          curl.exe -fsSL -o "$tmp\msys.7z" $msysUrl
          $base = "rubyinstaller-$ver-x64"
          7z x "$tmp\ruby.7z" "-o$tmp" -bd "-xr!$base\share\doc" | Out-Null
          Move-Item -Force (Join-Path $tmp $base) $prefix
          $msysExtract = Join-Path $env:RUNNER_TEMP 'msys64'
          7z x "$tmp\msys.7z" "-o$msysExtract" -aoa -bd | Out-Null
          Move-Item -Force $msysExtract (Join-Path $prefix 'msys64')
          Add-Content $env:GITHUB_PATH "$prefix\bin"
          Add-Content $env:GITHUB_PATH "$prefix\msys64\ucrt64\bin"
          Add-Content $env:GITHUB_PATH "$prefix\msys64\usr\bin"
          Add-Content $env:GITHUB_ENV 'MAKE=make'
          $ridk = Join-Path $prefix 'bin\ridk.cmd'
          if (Test-Path $ridk) {
            cmd /c "`"$ridk`" enable"
          }

      - name: Install test gems (emulated x64 Ruby)
        if: env.WINDOWS_ARM_X64_RUBY == 'true'
        shell: pwsh
        run: gem install rake rake-compiler minitest --no-document

      - name: Show platform
        run: ruby -e 'puts RUBY_PLATFORM, RbConfig::CONFIG["arch"], RbConfig::CONFIG["host_cpu"]'

      - name: Compile and test
        if: env.WINDOWS_ARM_X64_RUBY != 'true'
        run: bundle exec rake

      - name: Compile and test
        if: env.WINDOWS_ARM_X64_RUBY == 'true'
        run: rake compile test

  test-big-endian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests on s390x (big-endian) via QEMU
        uses: uraimo/run-on-arch-action@460cb8e6d9f726a588fc9b5e681c8a6cab09ae41 # v3.2.0
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y ruby ruby-dev gcc make rake
          run: |
            ruby -e 'puts "byteorder packed: #{[1].pack("l*")}"'
            gem install rake rake-compiler minitest --no-document
            rake compile test
