name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile and test
        run: bundle exec rake

  test-big-endian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run tests on s390x (big-endian) via QEMU
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y ruby ruby-dev gcc make rake
          run: |
            ruby -e 'puts "byteorder packed: #{[1].pack("l*")}"'
            gem install rake rake-compiler minitest --no-document
            rake compile test
